#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = hyprpanel
exec-once = hypridle
exec-once = ~/.config/hypr/wallpaper.sh ~/Pictures/Walls/veil-nebula-purple.jpg
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user start graphical-session.target
exec-once = liquidctl --match Kraken set lcd screen orientation 270 && liquidctl --match Kraken set lcd screen liquid

